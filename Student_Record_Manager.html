<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Record Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);min-height:100vh;padding:25px}
.container{max-width:950px;margin:auto;background:white;border-radius:18px;box-shadow:0 10px 35px #0002;overflow:hidden}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:28px;text-align:center}
header h1{margin:0 0 7px;font-size:30px}
header p{margin:0;opacity:.9}
.form{padding:25px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
label{font-weight:bold;display:block;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}
input:focus{outline:2px solid #818cf8;border-color:#6366f1}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
button{border:0;border-radius:9px;padding:11px 18px;font-weight:bold;cursor:pointer}
.add{background:#4f46e5;color:white}.clear{background:#e2e8f0}
.delete{background:#ef4444;color:white}.download{background:#16a34a;color:white}
button:hover{opacity:.9}
.records{padding:0 25px 25px}
h2{font-size:20px;margin:5px 0 15px}
.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:13px;text-align:left;border-bottom:1px solid #e2e8f0}
th{background:#f1f5f9}
tr.selected{background:#e0e7ff}
.message{margin-top:12px;padding:10px;border-radius:8px;display:none}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.empty{text-align:center;color:#64748b;padding:25px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.buttons button{width:100%}body{padding:10px}header h1{font-size:24px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>STUDENT RECORD MANAGER</h1>
<p>Add, validate, save, read, delete and download student records</p>
</header>

<section class="form">
<div class="grid">
<div>
<label>Student ID</label>
<input id="studentId" placeholder="Enter Student ID">
</div>
<div>
<label>Student Name</label>
<input id="studentName" placeholder="Enter Student Name">
</div>
<div>
<label>Email</label>
<input id="email" type="email" placeholder="student@gmail.com">
</div>
</div>

<div class="buttons">
<button class="add" onclick="addStudent()">➕ Add Student</button>
<button class="clear" onclick="clearForm()">Clear</button>
<button class="delete" onclick="deleteSelected()">🗑 Delete Selected</button>
<button class="download" onclick="downloadRecords()">⬇ Download Records</button>
</div>
<div id="message" class="message"></div>
</section>

<section class="records">
<h2>📋 Student Records</h2>
<div class="table-wrap">
<table>
<thead><tr><th>Student ID</th><th>Student Name</th><th>Email</th></tr></thead>
<tbody id="recordBody"></tbody>
</table>
</div>
</section>
</div>

<script>
let records = JSON.parse(localStorage.getItem("studentRecords") || "[]");
let selectedId = null;

function showMessage(text,type){
 const m=document.getElementById("message");
 m.textContent=text;
 m.className="message "+type;
 setTimeout(()=>m.className="message",3000);
}

function saveRecords(){
 localStorage.setItem("studentRecords",JSON.stringify(records));
}

function renderRecords(){
 const body=document.getElementById("recordBody");
 body.innerHTML="";
 if(records.length===0){
   body.innerHTML='<tr><td colspan="3" class="empty">No student records found.</td></tr>';
   return;
 }
 records.forEach(r=>{
   const tr=document.createElement("tr");
   if(r.id===selectedId) tr.className="selected";
   tr.onclick=()=>{selectedId=r.id;renderRecords()};
   tr.innerHTML=`<td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.email)}</td>`;
   body.appendChild(tr);
 });
}

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function addStudent(){
 try{
   const id=document.getElementById("studentId").value.trim();
   const name=document.getElementById("studentName").value.trim();
   const email=document.getElementById("email").value.trim();
   if(!id || !name || !email) throw new Error("All fields are required.");
   const emailRegex=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
   if(!emailRegex.test(email)) throw new Error("Please enter a valid email address.");
   if(records.some(r=>r.id.toLowerCase()===id.toLowerCase()))
      throw new Error("Student ID already exists.");
   records.push({id,name,email});
   saveRecords();
   renderRecords();
   clearForm();
   showMessage("Student added successfully!","success");
 }catch(e){showMessage(e.message,"error")}
}

function clearForm(){
 document.getElementById("studentId").value="";
 document.getElementById("studentName").value="";
 document.getElementById("email").value="";
 selectedId=null;
 renderRecords();
}

function deleteSelected(){
 try{
   if(selectedId===null) throw new Error("Select a student record first.");
   const student=records.find(r=>r.id===selectedId);
   if(confirm("Delete "+student.name+"?")){
      records=records.filter(r=>r.id!==selectedId);
      selectedId=null;
      saveRecords();
      renderRecords();
      showMessage("Student deleted successfully!","success");
   }
 }catch(e){showMessage(e.message,"error")}
}

function downloadRecords(){
 try{
   if(records.length===0) throw new Error("There are no records to download.");
   let csv="Student ID,Student Name,Email\n";
   records.forEach(r=>{
     csv += `"${r.id.replace(/"/g,'""')}","${r.name.replace(/"/g,'""')}","${r.email.replace(/"/g,'""')}"\n`;
   });
   const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   a.href=url;
   a.download="student_records.csv";
   a.click();
   URL.revokeObjectURL(url);
   showMessage("Records downloaded successfully!","success");
 }catch(e){showMessage(e.message,"error")}
}

renderRecords();
</script>
</body>
</html>
